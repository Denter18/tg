# Конфигурация Cloudflare Worker для NoDPI TG Bridge.
# Замените имя на свое: workers.dev-имя станет частью URL моста
# (wss://<имя>.<пользователь>.workers.dev), который вводится в приложении.

name = "nodpi-tg-bridge"
main = "worker.js"
compatibility_date = "2026-11-01"

# Бесплатного тарифа хватает с запасом: WebSocket-соединения долгоживущие,
# оплачиваются только запросы (открытие соединения), а не кадры.
