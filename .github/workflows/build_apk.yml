name: Build NoDPI TG Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Системный python3 раннера (3.10 на ubuntu-22.04) вместо setup-python:
      # тот качает интерпретатор с релизов GitHub, их CDN периодически падает (504).
      - name: Show system Python
        run: python3 --version

      # Ключ считаем ДО правки buildozer.spec (ниже sed добавляет android.sdk_path),
      # иначе хэш на restore и на save различался бы и кэш не попадал в цель.
      - name: Compute Buildozer cache key
        id: ck
        run: |
          H=$(sha256sum buildozer.spec p4a_hook.py | sha256sum | cut -c1-16)
          echo "key=buildozer-tgbridge-v1-Linux-$H" >> "$GITHUB_OUTPUT"
          echo "cache key: buildozer-tgbridge-v1-Linux-$H"

      # Gradle 8 / Android Gradle Plugin требуют Java 17, а на раннере по
      # умолчанию JAVA_HOME указывает на Java 11 (установка openjdk-17 это не меняет).
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Buildozer cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ steps.ck.outputs.key }}
          restore-keys: buildozer-tgbridge-v1-Linux-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake autopoint gettext libltdl-dev

      # Без venv: buildozer изнутри вызывает `pip install --user`, что запрещено
      # внутри виртуального окружения. Системный python 3.10 на ubuntu-22.04
      # допускает --user, ставим buildozer в пользовательский site-packages.
      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade "setuptools<69.0.0" wheel virtualenv
          python3 -m pip install --user "cython==0.29.36" "buildozer==1.5.0"

      # buildozer ищет sdkmanager по старому пути <sdk>/tools/bin/sdkmanager,
      # а на раннере установлен современный cmdline-tools. Делаем симлинк
      # и прописываем путь к SDK в buildozer.spec (в репозитории его нет,
      # чтобы spec работал и локально).
      - name: Configure pre-installed Android SDK for Buildozer
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "Android SDK: $SDK_DIR"

          if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::cmdline-tools/latest/bin/sdkmanager не найден в $SDK_DIR"
            ls -la "$SDK_DIR" "$SDK_DIR/cmdline-tools" || true
            exit 1
          fi

          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

          yes | "$SDK_DIR/tools/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDK_DIR/tools/bin/sdkmanager" --sdk_root="$SDK_DIR" \
            "platforms;android-33" "build-tools;33.0.2" "platform-tools"

          # p4a берёт самую новую версию build-tools (на раннере это 37.x), которая
          # не проверялась с этим набором версий. Оставляем только 33.0.2.
          for d in "$SDK_DIR"/build-tools/*; do
            [ "$(basename "$d")" = "33.0.2" ] || sudo rm -rf "$d"
          done
          ls "$SDK_DIR/build-tools"

          sed -i "/^\[app\]/a android.sdk_path = $SDK_DIR" buildozer.spec
          grep -n "android.sdk_path" buildozer.spec

      # p4a качает зависимости (SDL, openssl и т.д.) с внешних серверов;
      # их CDN периодически отдаёт 504. Повторяем прогон до 3 раз —
      # buildozer/p4a переживают повторный запуск на частичной сборке.
      # ВАЖНО: pipefail, иначе `buildozer | tee` вернёт код tee и break
      # сработает после первой же (провалившейся) попытки.
      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          buildozer --version
          ok=0
          for i in 1 2 3; do
            echo "::group::Попытка $i"
            if buildozer -v android debug 2>&1 | tee build.log; then
              echo "::endgroup::"
              ok=1
              break
            fi
            echo "::endgroup::"
            echo "::warning::Попытка $i упала, повторяем"
            sleep 15
          done
          [ "$ok" = "1" ]
          ls -lh bin/*.apk

      # Если сборка упала, выводим нужную часть лога в аннотации запуска -
      # их можно прочитать без скачивания логов.
      - name: Report build errors
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' build.log | cut -c1-300 > clean.log
          END=$(grep -n -m1 -E '^# +ENVIRONMENT|^# Command failed' clean.log | cut -d: -f1)
          END=${END:-$(wc -l < clean.log)}
          echo "failure marker at line $END of $(wc -l < clean.log)"
          enc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          head -n "$END" clean.log | grep -v -E "^Compiling |^\[DEBUG\].*running zip" | tail -n 25 | enc > part1.txt
          echo "::error title=Before failure::$(cat part1.txt)"
          grep -E '^# Command failed' clean.log | head -n 2 | enc > part2.txt
          echo "::error title=Failed command::$(cat part2.txt)"
          head -n "$END" clean.log | grep -n -E '(^|[^a-zA-Z_])(ERROR|Error:|error:|FAILED|Exception|Traceback|not found|No such file|cannot find)' | grep -v -E 'Compiling |/Lib/test/' | tail -n 20 | enc > part3.txt
          echo "::error title=Error lines::$(cat part3.txt)"
          grep -n -m1 -E 'What went wrong|FAILURE: Build failed|Execution failed' clean.log || true
          G=$(grep -n -m1 -E 'FAILURE: Build failed|What went wrong' clean.log | cut -d: -f1)
          if [ -n "$G" ]; then sed -n "$((G-25)),$((G+30))p" clean.log | enc > part4.txt; else grep -n -E '\.java:[0-9]+: error|Could not|Unsupported|Duplicate|AAPT|Execution failed' clean.log | tail -n 20 | enc > part4.txt; fi
          echo "::error title=Gradle error::$(cat part4.txt)"

      - name: Show built APK
        run: ls -lh bin/*.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoDPI-TG-Bridge-APK
          path: bin/*.apk
          if-no-files-found: error

      # Кэш сохраняем и при падении сборки, чтобы повторные прогоны были быстрыми.
      - name: Save Buildozer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ steps.ck.outputs.key }}
